{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}ProjectForge{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header>
    <nav>
      {% block nav_back %}
      {% endblock %}

      <a class="brand-link" href="{% url 'workspaces:home' %}">
        ProjectForge
      </a>

      {% block nav_actions %}
      {% endblock %}
    </nav>
  </header>

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}
    {% endblock %}
  </main>

  <script src="{% static 'dist/main.js' %}" defer></script>
</body>
</html>
